# Default Configuration for Windows Desktop Voice Assistant

system:
  name: "Assistant"
  wake_words:
    - "hey assistant"
    - "hey jarvis"
  language: "en"
  debug: false

audio:
  input_device_index: null # null uses system default microphone
  output_device_index: null # null uses system default speaker
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  vad_energy_threshold: 0.015
  vad_silence_duration_seconds: 1.2

stt:
  engine: "faster-whisper" # "faster-whisper" or "mock"
  model_size: "tiny"       # "tiny", "base", "small"
  device: "cpu"           # "cpu" or "cuda"
  compute_type: "int8"    # "int8" or "float16"

tts:
  engine: "pyttsx3"       # "pyttsx3"
  rate: 190               # Words per minute
  volume: 1.0             # 0.0 to 1.0
  voice_id: null          # null uses default Windows voice

llm:
  provider: "rule_based"  # "rule_based", "ollama", "openai"
  fallback_to_rules: true # Use rule matcher when LLM is unavailable/offline
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"
    timeout: 15
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: null
    model: "gpt-4o-mini"
    timeout: 15

conversation:
  max_history_turns: 20
  system_prompt: >
    You are a helpful, concise, and friendly Windows desktop voice assistant.
    Provide direct, conversational responses suitable for voice output.
    Keep your spoken answers brief (1-3 sentences) unless the user asks for details.

security:
  require_confirmation_for_medium_risk: true
  disallow_high_risk: true
  audit_log_path: "logs/audit.log"

logging:
  level: "INFO"
  log_file: "logs/assistant.log"
  max_bytes: 10485760 # 10 MB
  backup_count: 5
