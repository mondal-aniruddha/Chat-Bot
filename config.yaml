system:
  name: Assistant
  wake_words:
  - hey assistant
  - hey jarvis
  - hey mondal
  - hi assistant
  - hi jarvis
  - hi mondal
  language: en
  debug: false
audio:
  input_device_index: null
  output_device_index: null
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  vad_energy_threshold: 0.015
  vad_silence_duration_seconds: 1.2
stt:
  engine: faster-whisper
  model_size: tiny
  device: cpu
  compute_type: int8
tts:
  engine: pyttsx3
  rate: 280
  volume: 1.0
  voice_id: null
llm:
  provider: internet
  fallback_to_rules: true
  fallback_to_internet: true
  ollama:
    base_url: http://localhost:11434
    model: llama3.2
    timeout: 15
  openai:
    base_url: https://api.openai.com/v1
    api_key: ''
    model: gpt-4o-mini
    timeout: 15
  gemini:
    api_key: null
    model: gemini-2.0-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout: 15
  claude:
    api_key: null
    model: claude-3-5-haiku-20241022
    base_url: https://api.anthropic.com/v1
    timeout: 15
  openrouter:
    api_key: null
    model: google/gemini-2.0-flash-exp:free
    base_url: https://openrouter.ai/api/v1
    timeout: 20
conversation:
  max_history_turns: 20
  system_prompt: 'You are a helpful, concise, and friendly Windows desktop voice assistant.
    Provide direct, conversational responses suitable for voice output. Keep your
    spoken answers brief (1-3 sentences) unless the user asks for details.

    '
security:
  require_confirmation_for_medium_risk: true
  disallow_high_risk: true
  audit_log_path: logs/audit.log
logging:
  level: INFO
  log_file: logs/assistant.log
  max_bytes: 10485760
  backup_count: 5
